name: fix-pages-cert
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/fix-pages-cert.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Status before
        run: |
          gh api repos/$R/pages | tee before.json
          echo "--- DNS"; dig +short saquish.capital A; dig +short www.saquish.capital CNAME
          echo "--- live"; curl -sSIk --max-time 20 https://saquish.capital/ | head -3 || true
          echo | openssl s_client -connect saquish.capital:443 -servername saquish.capital 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
      - name: Reset custom domain (remove, wait, re-add)
        run: |
          state=$(jq -r '.https_certificate.state // "none"' before.json)
          echo "cert state before: $state"
          if [ "$state" != "approved" ]; then
            echo '{"cname":null}' | gh api -X PUT repos/$R/pages --input - && echo removed
            sleep 45
            echo '{"cname":"saquish.capital"}' | gh api -X PUT repos/$R/pages --input - && echo re-added
          fi
      - name: Poll for certificate
        run: |
          for i in $(seq 1 40); do
            s=$(gh api repos/$R/pages | tee now.json | jq -r '.https_certificate.state // "none"')
            d=$(jq -r '.https_certificate.description // ""' now.json)
            echo "[$i] state=$s  $d"
            [ "$s" = "approved" ] && break
            sleep 30
          done
          cat now.json
      - name: Enforce HTTPS
        run: |
          s=$(jq -r '.https_certificate.state // "none"' now.json)
          if [ "$s" = "approved" ]; then
            echo '{"https_enforced":true}' | gh api -X PUT repos/$R/pages --input - && echo "https enforced"
          else
            echo "cert not approved yet; leaving enforcement off"
          fi
          echo "--- final live check"
          curl -sSI --max-time 20 https://saquish.capital/ | head -5 || true
          gh api repos/$R/pages
